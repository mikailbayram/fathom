# Name of your application. Used to uniquely configure containers.
service: fathom

image: fathom

# One Hetzner CPX31 runs both roles. The job role is a separate container so a
# wedged crawl cannot take the web process down with it.
servers:
  web:
    - 2.28.239.107
  job:
    hosts:
      - 2.28.239.107
    cmd: bin/jobs
    env:
      clear:
        # Solid Queue runs JOB_THREADS workers; the Active Record pool is sized
        # from RAILS_MAX_THREADS, so it has to exceed the worker count or the
        # threads starve waiting for connections.
        RAILS_MAX_THREADS: 10

# How long a new container has to pass its health check. First boot runs
# db:prepare against four empty databases and loads a schema with an HNSW
# index, which does not fit in the 30s default.
deploy_timeout: 120

proxy:
  ssl: true
  host: fathom.solution404.io
  healthcheck:
    path: /up
    # How long one probe may take, not how long boot may take -- that is
    # deploy_timeout above.
    timeout: 10

# Kamal runs a registry:3 container locally and SSH-forwards port 5555 to the
# deploy hosts, so they pull through the tunnel. No external registry, no
# credentials. Switch to ghcr.io if CI ever needs to deploy.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    # All four: db:prepare touches every configured database, and a missing URL
    # falls back to the localhost:5433 default meant for docker-compose.
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - OPENAI_API_KEY
    - OPENROUTER_API_KEY
    - FIRECRAWL_API_KEY
    # Unset, these refuse every request in production rather than opening the
    # app up. A deploy that forgets them fails closed and says 401.
    - FATHOM_USERNAME
    - FATHOM_PASSWORD
  clear:
    APP_MODE: live
    ENABLE_LIVE_AI: true
    # Analysis and chat route through the aggregator; embeddings stay pinned to
    # OpenAI because the stored vectors were produced by text-embedding-3-small
    # and changing the embedding model invalidates them.
    AI_PROVIDER: openrouter
    AI_EMBEDDING_PROVIDER: openai
    # Named here so production cannot drift from the default the way the
    # budgets did. This is the one call a visitor waits on.
    AI_CHAT_EFFORT: low
    # The model IDs for the same reason, and one more: the code defaults are
    # bare OpenAI names, and this deployment routes through the aggregator,
    # which namespaces them. Unnamed, production asks OpenRouter for model IDs
    # OpenRouter does not publish.
    AI_FAST_MODEL: openai/gpt-6-luna
    AI_ANALYSIS_MODEL: openai/gpt-6-sol
    AI_CHAT_MODEL: openai/gpt-6-luna
    # Pacing, named for the same reason and set from what the key reports rather
    # than from the code default. That default is 20 a minute, which is what a
    # free OpenRouter key allows; this key is funded, and OpenRouter meters a
    # funded key by credits -- its per-key rate limit reads -1 and declares
    # itself deprecated. Twenty a minute was therefore spacing calls three
    # seconds apart to respect a ceiling that is not there, and a scan makes a
    # couple of hundred of them: ten minutes of a salesperson watching a
    # progress bar, spent waiting on nothing.
    #
    # Not zero. AI_CALL_CONCURRENCY already holds six calls in flight at about
    # two and a half seconds each, so roughly 140 a minute is the real ceiling
    # and this sits just under it -- close enough to cost nothing, low enough to
    # still catch a stage that fans out further than anyone intended.
    AI_REQUESTS_PER_MINUTE: 120
    # The budgets, named here because .env never leaves a developer's machine.
    # Left out, production silently runs the code defaults -- 5,000 pages a
    # scan -- and the first thing anyone notices is the crawler bill.
    MAX_SCAN_PAGES: 60
    MAX_SCAN_AI_COST_USD: 5.00
    MAX_DAILY_AI_COST_USD: 50.00

    RAILS_MAX_THREADS: 3
    WEB_CONCURRENCY: 1
    JOB_THREADS: 8
    # SOLID_QUEUE_IN_PUMA is deliberately absent. config/puma.rb tests the
    # variable for presence, so "false" would still load the plugin and the
    # web container would run a second supervisor.

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Active Storage uses the :local disk service, so this volume is what keeps
# uploads alive across deploys.
volumes:
  - "fathom_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: pgvector/pgvector:pg17
    host: 2.28.239.107
    # Loopback only: reachable from the app containers over Kamal's Docker
    # network as host "fathom-db", never from the public internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: fathom
        POSTGRES_DB: fathom_production
      secret:
        - POSTGRES_PASSWORD
    # Tuning passed as flags rather than a mounted postgresql.conf: pointing
    # config_file outside PGDATA also moves where Postgres looks for
    # pg_hba.conf, which then does not exist and the server will not boot.
    cmd: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=256MB
      -c work_mem=8MB
      -c max_connections=75
    directories:
      - data:/var/lib/postgresql/data
